# Spring Boot 应用配置
spring:
  application:
    name: self
  
  # H2 数据库控制台（可选，用于调试）
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # 数据源配置（H2 内存数据库）
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  
  # JPA/Hibernate 配置（如果使用的话）
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

# 日志配置
logging:
  level:
    com.bujian.self: DEBUG
    org.springframework.jdbc: DEBUG
